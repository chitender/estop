[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "estop"
version = "2.1.0"
description = "htop for Elasticsearch search performance: live thread-pool, hot-shard, slow-task and config-audit monitor. Stdlib-only, read-only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Chitender Kumar" }]
keywords = ["elasticsearch", "sre", "observability", "monitoring", "troubleshooting", "tui", "performance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/chitender/estop"
Issues = "https://github.com/chitender/estop/issues"

[project.scripts]
estop = "estop:main"

[tool.setuptools]
py-modules = ["estop"]
